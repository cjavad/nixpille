version: '3'

silent: true

vars:
  HOST:
    sh: 'h=$(hostname); case $h in ideapad|p1gen8|vm) echo $h;; *) echo vm;; esac'
  BW:
    sh: 'echo "${BW:-bw}"'
  BW_ITEM: nixpille-secrets

includes:
  secrets:
    taskfile: ./tasks/secrets.yml
    dir: .

tasks:
  default:
    cmds:
      - task --list

  vm:
    desc: Build and run VM
    cmds:
      - nix build .#nixosConfigurations.{{.HOST}}.config.system.build.vm
      - ./result/bin/run-{{.HOST}}-vm

  vm:rm:
    desc: Remove VM disk
    cmds:
      - rm -f {{.HOST}}.qcow2

  switch:
    desc: Switch to new config
    cmds:
      - sudo nixos-rebuild switch --flake .#{{.HOST}}

  check:
    desc: Check flake
    cmds:
      - nix flake check

  test:
    desc: Run tests
    cmds:
      - nix build .#checks.x86_64-linux.smoke -L

  fmt:
    desc: Format nix files
    cmds:
      - nix fmt .

  update:
    desc: Update flake inputs
    cmds:
      - nix flake update

  gc:
    desc: Garbage collect
    cmds:
      - sudo nix-collect-garbage -d

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f result *.qcow2

  iso:
    desc: Build installer ISO
    cmds:
      - nix build .#nixosConfigurations.iso.config.system.build.isoImage
      - echo "ISO at ./result/iso/*.iso"

  iso:test:
    desc: Test installer ISO in QEMU
    deps: [iso]
    cmds:
      - |
        # Create test disk if it doesn't exist
        if [ ! -f disk.img ]; then
          qemu-img create -f qcow2 disk.img 20G
        fi
      - |
        qemu-system-x86_64 \
          -m 4G \
          -smp 4 \
          -enable-kvm \
          -boot d \
          -cdrom $(find result/iso -name '*.iso' -type f | head -1) \
          -drive file=disk.img,format=qcow2 \
          -nic user,model=virtio-net-pci \
          -vga virtio \
          -display gtk

  iso:test:clean:
    desc: Remove ISO test disk
    cmds:
      - rm -f disk.img

  release:
    desc: Create GitHub release
    vars:
      VERSION: '{{.VERSION | default (now | date "2006.01.02")}}'
    cmds:
      - task: iso
      - gh release create "{{.VERSION}}" --title "nixpille {{.VERSION}}" --generate-notes $(find result/iso -name '*.iso' -type f)
