version: '3'

silent: true

vars:
  HOST:
    sh: 'h=$(hostname); case $h in ideapad|p1gen8|vm) echo $h;; *) echo vm;; esac'
  BW:
    sh: 'echo "${BW:-bw}"'
  BW_ITEM: nixpille-secrets

includes:
  secrets:
    taskfile: ./ops/secrets/Taskfile.yml
    dir: .

tasks:
  default:
    cmds:
      - task --list

  vm:
    desc: Build and run VM
    cmds:
      - nix build .#nixosConfigurations.{{.HOST}}.config.system.build.vm
      - ./result/bin/run-{{.HOST}}-vm

  switch:
    desc: Switch to new config
    cmds:
      - sudo nixos-rebuild switch --flake .#{{.HOST}}

  check:
    desc: Check flake
    cmds:
      - nix flake check

  test:
    desc: Run tests
    cmds:
      - nix build .#checks.x86_64-linux.smoke -L

  fmt:
    desc: Format nix files
    cmds:
      - nix fmt .

  update:
    desc: Update flake inputs
    cmds:
      - nix flake update

  gc:
    desc: Garbage collect
    cmds:
      - sudo nix-collect-garbage -d

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f result *.qcow2

  iso:
    desc: Build full installer ISO (includes all host closures)
    cmds:
      - nix build .#nixosConfigurations.iso.config.system.build.isoImage -L
      - echo "ISO at ./result/iso/*.iso"

  iso:minimal:
    desc: Build minimal installer ISO (no host closures, smaller/faster)
    cmds:
      - nix build .#nixosConfigurations.iso-minimal.config.system.build.isoImage -L
      - echo "ISO at ./result/iso/*.iso"

  iso:test:
    desc: Test installer ISO in QEMU (use MINIMAL=1 for minimal ISO)
    vars:
      CONFIG: '{{if .MINIMAL}}iso-minimal{{else}}iso{{end}}'
    cmds:
      - nix build .#nixosConfigurations.{{.CONFIG}}.config.system.build.isoImage -L
      - |
        # Create test disk if it doesn't exist (40G for full install)
        if [ ! -f disk.qcow2 ]; then
          qemu-img create -f qcow2 disk.qcow2 40G
        fi
      - |
        nix shell nixpkgs#qemu nixpkgs#OVMF -c sh -c '
          qemu-system-x86_64 \
            -m 8G \
            -smp 4 \
            -cpu host \
            -enable-kvm \
            -drive if=pflash,format=raw,readonly=on,file=$(dirname $(which qemu-system-x86_64))/../share/qemu/edk2-x86_64-code.fd \
            -boot d \
            -cdrom $(find result/iso -name "*.iso" -type f | head -1) \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -nic user,model=virtio-net-pci \
            -vga virtio \
            -display gtk
        '

  iso:boot:
    desc: Boot from installed disk image
    cmds:
      - |
        nix shell nixpkgs#qemu nixpkgs#OVMF -c sh -c '
          qemu-system-x86_64 \
            -m 8G \
            -smp 4 \
            -cpu host \
            -enable-kvm \
            -drive if=pflash,format=raw,readonly=on,file=$(dirname $(which qemu-system-x86_64))/../share/qemu/edk2-x86_64-code.fd \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -nic user,model=virtio-net-pci \
            -vga virtio \
            -display gtk
        '

  release:
    desc: Create GitHub release
    vars:
      VERSION: '{{.VERSION | default (now | date "2006.01.02")}}'
    cmds:
      - task: iso
      - gh release create "{{.VERSION}}" --title "nixpille {{.VERSION}}" --generate-notes $(find result/iso -name '*.iso' -type f)
