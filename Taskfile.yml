version: '3'
silent: true

vars:
  HOST:
    sh: 'h=$(hostname); case $h in ideapad|p1gen8|vm) echo $h;; *) echo vm;; esac'

includes:
  secrets:
    taskfile: ./ops/secrets/Taskfile.yml
    dir: .

tasks:
  default:
    cmds:
      - task --list

  switch:
    desc: Switch to new config
    cmds:
      - sudo nixos-rebuild switch --flake .#{{.HOST}}

  build:
    desc: Build config without switching
    cmds:
      - nixos-rebuild build --flake .#{{.HOST}}

  test:
    desc: Test config in VM
    cmds:
      - nixos-rebuild build-vm --flake .#{{.HOST}}
      - ./result/bin/run-{{.HOST}}-vm

  check:
    desc: Check flake
    cmds:
      - nix flake check

  fmt:
    desc: Format nix files
    cmds:
      - nix fmt

  update:
    desc: Update flake inputs
    cmds:
      - nix flake update

  gc:
    desc: Garbage collect
    cmds:
      - sudo nix-collect-garbage -d
      - nix-collect-garbage -d

  # ISO
  iso:
    desc: Build installer ISO
    cmds:
      - nix build .#nixosConfigurations.iso.config.system.build.isoImage -L
      - ls -lh result/iso/*.iso

  iso:run:
    desc: Test ISO in QEMU
    cmds:
      - task: iso
      - |
        [ -f disk.qcow2 ] || qemu-img create -f qcow2 disk.qcow2 40G
      - |
        qemu-system-x86_64 \
          -enable-kvm -cpu host -m 8G -smp 4 \
          -bios /usr/share/ovmf/x64/OVMF.fd \
          -boot d \
          -cdrom $(find result/iso -name "*.iso" | head -1) \
          -drive file=disk.qcow2,format=qcow2,if=virtio \
          -nic user,model=virtio-net-pci \
          -vga virtio -display gtk

  iso:boot:
    desc: Boot installed disk
    cmds:
      - |
        qemu-system-x86_64 \
          -enable-kvm -cpu host -m 8G -smp 4 \
          -bios /usr/share/ovmf/x64/OVMF.fd \
          -drive file=disk.qcow2,format=qcow2,if=virtio \
          -nic user,model=virtio-net-pci \
          -vga virtio -display gtk

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f result *.qcow2
