version: '3'

silent: true

vars:
  HOST:
    sh: 'h=$(hostname); case $h in ideapad|p1gen8|vm) echo $h;; *) echo vm;; esac'
  BW:
    sh: 'echo "${BW:-bw}"'
  BW_ITEM: nixpille-secrets
  EXTRA_SUBSTITUTERS: https://hyprland.cachix.org https://nix-community.cachix.org https://vicinae.cachix.org
  EXTRA_TRUSTED_KEYS: hyprland.cachix.org-1:a7pgxzMz7+VO9dXvamGIBD/FX5BsGNN7CQ56MWRspLU= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc=
  NIX_FLAGS: --extra-substituters "{{.EXTRA_SUBSTITUTERS}}" --extra-trusted-public-keys "{{.EXTRA_TRUSTED_KEYS}}"

includes:
  secrets:
    taskfile: ./tasks/secrets.yml
    dir: .

tasks:
  default:
    cmds:
      - task --list

  vm:
    desc: Build and run VM
    cmds:
      - nix build {{.NIX_FLAGS}} .#nixosConfigurations.{{.HOST}}.config.system.build.vm
      - ./result/bin/run-{{.HOST}}-vm

  vm:rm:
    desc: Remove VM disk
    cmds:
      - rm -f {{.HOST}}.qcow2

  switch:
    desc: Switch to new config
    cmds:
      - sudo nixos-rebuild switch {{.NIX_FLAGS}} --flake .#{{.HOST}}

  check:
    desc: Check flake
    cmds:
      - nix flake check

  test:
    desc: Run tests
    cmds:
      - nix build {{.NIX_FLAGS}} .#checks.x86_64-linux.smoke -L

  fmt:
    desc: Format nix files
    cmds:
      - nix fmt .

  update:
    desc: Update flake inputs
    cmds:
      - nix flake update

  gc:
    desc: Garbage collect
    cmds:
      - sudo nix-collect-garbage -d

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f result *.qcow2

  iso:
    desc: Build installer ISO
    cmds:
      - nix build {{.NIX_FLAGS}} .#nixosConfigurations.iso.config.system.build.isoImage
      - echo "ISO at ./result/iso/*.iso"

  release:
    desc: Create GitHub release
    vars:
      VERSION: '{{.VERSION | default (now | date "2006.01.02")}}'
    cmds:
      - task: iso
      - gh release create "{{.VERSION}}" --title "nixpille {{.VERSION}}" --generate-notes $(find result/iso -name '*.iso' -type f)
