name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Flake check (runs all checks)
        run: nix flake check

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Smoke test
        run: nix build .#checks.x86_64-linux.smoke -L

      - name: Check formatting
        run: nix fmt -- --ci .

      - name: Check for eval warnings
        run: |
          warnings=""
          for cfg in $(nix eval .#nixosConfigurations --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)' --raw); do
            output=$(nix eval .#nixosConfigurations.$cfg.config.system.build.toplevel 2>&1 || true)
            if echo "$output" | grep -i "^warning:" | grep -v "Git tree"; then
              warnings="$warnings\n=== nixos/$cfg ===\n$output"
            fi
          done
          for user in $(nix eval .#homeConfigurations --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)' --raw); do
            output=$(nix eval .#homeConfigurations.$user.activationPackage 2>&1 || true)
            if echo "$output" | grep -i "^warning:" | grep -v "Git tree"; then
              warnings="$warnings\n=== home/$user ===\n$output"
            fi
          done
          if [ -n "$warnings" ]; then
            echo "Found evaluation warnings:"
            echo -e "$warnings"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build VM config
        run: nix build .#nixosConfigurations.vm.config.system.build.toplevel --dry-run

      - name: Build ideapad config
        run: nix build .#nixosConfigurations.ideapad.config.system.build.toplevel --dry-run

      - name: Build p1gen8 config
        run: nix build .#nixosConfigurations.p1gen8.config.system.build.toplevel --dry-run

      - name: Build GHA config
        run: nix build .#nixosConfigurations.gha.config.system.build.toplevel --dry-run

      - name: Build ISO config
        run: nix build .#nixosConfigurations.iso.config.system.build.isoImage --dry-run
