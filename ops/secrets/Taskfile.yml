version: '3'

silent: true

vars:
  BW:
    sh: 'echo "${BW:-bw}"'
  BW_ITEM: nixpille-secrets
  SECRETS_FILE: ~/.config/sops/secrets.yaml
  AGE_KEY: ~/.config/sops/age/keys.txt

tasks:
  edit:
    desc: Edit secrets file (pulls first to avoid conflicts)
    cmds:
      - sops {{.SECRETS_FILE}}

  sync:
    desc: Sync deployed files back to secrets
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-sync.fish'

  manifest:
    desc: Generate manifest.nix from sops keys
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-manifest.fish'

  show:
    desc: Show decrypted secrets
    cmds:
      - sops -d {{.SECRETS_FILE}}

  add:
    desc: Add secret (FILE or VALUE)
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-add.fish; secrets_add "{{.KEY}}" "{{.FILE}}" "{{.VALUE}}"'

  init:
    desc: Initialize age key
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-init.fish'

  login:
    desc: Login/unlock Bitwarden
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-login.fish; secrets_login "{{.BW}}"'

  push:
    desc: Push secrets to Bitwarden
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-push.fish; secrets_push "{{.BW}}" "{{.BW_ITEM}}"'

  pull:
    desc: Pull secrets from Bitwarden
    cmds:
      - fish -l -c 'source ./ops/secrets/secrets-pull.fish; secrets_pull "{{.BW}}" "{{.BW_ITEM}}"'
