version: '3'
silent: true

vars:
  BW: '{{.BW | default "bw"}}'
  BW_ITEM: nixpille-secrets

tasks:
  login:
    desc: Login to Bitwarden
    cmds:
      - fish -c 'source ./ops/secrets/secrets-login.fish; secrets_login "{{.BW}}"'

  pull:
    desc: Pull from Bitwarden
    cmds:
      - fish -c 'source ./ops/secrets/secrets-pull.fish; secrets_pull "{{.BW}}" "{{.BW_ITEM}}"'

  push:
    desc: Push to Bitwarden
    cmds:
      - fish -c 'source ./ops/secrets/secrets-push.fish; secrets_push "{{.BW}}" "{{.BW_ITEM}}"'

  unlock:
    desc: Export to tmpfs (auto on login)
    cmds:
      - fish -c 'source ./ops/secrets/secrets-unlock.fish; secrets_unlock'

  lock:
    desc: Clear tmpfs
    cmds:
      - fish -c 'source ./ops/secrets/secrets-unlock.fish; secrets_lock'

  status:
    desc: Show status
    cmds:
      - fish -c 'source ./ops/secrets/secrets-unlock.fish; secrets_status'

  list:
    desc: List all secrets
    cmds:
      - fish -c 'source ./ops/secrets/secrets.fish; secret_list'

  add:
    desc: "Add secret: FILE=~/.ssh/id_ed25519 or KEYID=ABC123 (gpg)"
    cmds:
      - fish -c 'source ./ops/secrets/secrets.fish; secret_add_auto "{{.FILE}}" "{{.KEYID}}" "{{.NAME}}"'

  rm:
    desc: "Remove secret: KEY=ssh_id_ed25519"
    cmds:
      - fish -c 'source ./ops/secrets/secrets.fish; secret_remove "{{.KEY}}"'

  sync:
    desc: Sync all local secrets
    cmds:
      - fish -c 'source ./ops/secrets/secrets.fish; secrets_sync'
      - task: manifest

  edit:
    desc: Edit secrets.yaml
    cmds:
      - SOPS_AGE_KEY_FILE=/run/user/$(id -u)/sops/keys.txt sops ~/.config/sops/secrets.yaml

  show:
    desc: Show decrypted
    cmds:
      - SOPS_AGE_KEY_FILE=/run/user/$(id -u)/sops/keys.txt sops -d ~/.config/sops/secrets.yaml

  manifest:
    desc: Regenerate manifest.nix
    cmds:
      - fish -c 'source ./ops/secrets/secrets.fish; manifest_generate'

  setup:
    desc: Initial setup
    cmds: [task: login, task: pull, task: unlock]

  switch:
    desc: Unlock + home-manager switch
    cmds:
      - task: unlock
      - home-manager switch --flake .
