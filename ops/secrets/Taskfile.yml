version: '3'
silent: true

vars:
  SCRIPTS: ./ops/secrets

tasks:
  setup:
    desc: First-time setup (login + pull)
    cmds:
      - task: login
      - task: pull

  login:
    desc: Login/unlock Bitwarden
    cmds:
      - fish -c "source {{.SCRIPTS}}/lib/bw.fish && bw_login"

  pull:
    desc: Pull all secrets from BW
    cmds:
      - fish -c "source {{.SCRIPTS}}/secrets.fish && secrets_pull"

  sync:
    desc: Sync files back to BW
    cmds:
      - fish -c "source {{.SCRIPTS}}/files.fish && files_sync"

  export:
    desc: Export files from keyring to tmpfs (no BW needed)
    cmds:
      - fish -c "source {{.SCRIPTS}}/files.fish && files_export"

  status:
    desc: Show status
    cmds:
      - fish -c "source {{.SCRIPTS}}/secrets.fish && secrets_status"

  lock:
    desc: Clear credentials from memory
    cmds:
      - fish -c "source {{.SCRIPTS}}/secrets.fish && secrets_lock"

  # Add
  add:file:
    desc: "Add file (SRC=path DEST=target)"
    cmds:
      - fish -c "source {{.SCRIPTS}}/files.fish && files_add '{{.SRC}}' '{{.DEST}}'"

  add:ssh:
    desc: "Add SSH key (FILE=path)"
    cmds:
      - fish -c "source {{.SCRIPTS}}/ssh.fish && ssh_add '{{.FILE}}'"

  add:gpg:
    desc: "Add GPG key (KEYID=id [NAME=name])"
    cmds:
      - fish -c "source {{.SCRIPTS}}/gpg.fish && gpg_add '{{.KEYID}}' '{{.NAME}}'"

  # Remove
  rm:file:
    desc: "Remove file (NAME=filename)"
    cmds:
      - fish -c "source {{.SCRIPTS}}/files.fish && files_rm '{{.NAME}}'"

  rm:ssh:
    desc: "Remove SSH key (NAME=name)"
    cmds:
      - fish -c "source {{.SCRIPTS}}/ssh.fish && ssh_rm '{{.NAME}}'"

  rm:gpg:
    desc: "Remove GPG key (NAME=name)"
    cmds:
      - fish -c "source {{.SCRIPTS}}/gpg.fish && gpg_rm '{{.NAME}}'"

  # SOPS
  sops:edit:
    desc: Edit secrets.yaml
    cmds:
      - fish -c "source {{.SCRIPTS}}/secrets.fish && sops_edit"

  sops:show:
    desc: Show decrypted secrets.yaml
    cmds:
      - fish -c "source {{.SCRIPTS}}/secrets.fish && sops_show"
